<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoinScan SOL — Terfilter Scam</title>
<link rel="stylesheet" href="/static/style.css?v=32">
</head>
<body>
<div class="wrap">
  <header>
  <div class="dalam">
  <h1><a href="/">KoinScan <span>SOL</span></a></h1>
    <div class="sub"><span class="live"></span>🚫 TERFILTER — HONEYPOT · BUNDLER · RUG · SCAM</div>
  </div>
</header>
  <div id="nav"></div>
  <div class="stats">
    <div class="stat"><b id="st-total">–</b>Token dipindai</div>
    <div class="stat"><b id="st-time">–</b>Update terakhir</div>
  </div>
  <h2>KOIN YANG DITOLAK ANALISA RISIKO</h2>
  <div class="tabel-wrap"><table class="mini" id="t"><thead><tr>
    <th>#</th><th>Koin</th><th>Sumber</th><th>Putusan</th><th>Alasan</th>
    <th class="r">Skor</th><th class="r">MC</th><th class="r">1j</th><th class="r">24j</th><th class="r hide-m">Top-10 Hold%</th>
    <th class="r hide-m">Holder</th></tr></thead><tbody></tbody></table></div>
  <footer>
  <div>Data: pump.fun · DexScreener · GeckoTerminal · RugCheck — diproses mandiri tanpa perantara.</div>
  <div class="foot-by">KoinScan by <b>arifrfza</b></div>
</footer>
</div>
<script src="/static/app.js?v=27"></script>
<script src="/static/nav.js?v=9"></script>
<script>
async function muat() {
  try {
    const f = await ambilFeed();
    const scam = f.terfilter_scam || [];
    document.pasangSortir('#t', [4,5,6,7,8]);
querySelector('#t tbody').innerHTML = scam.length
      ? scam.map((k,i)=>{
          const r = k.risiko || {};
          const alasan = (r.flag||[]).map(x=>x.tipe).join(', ') || r.putusan;
          const warna = r.putusan==='SCAM' ? 'var(--red)' : 'var(--orange)';
          return `<tr style="opacity:.8">
            <td>${i+1}</td>
            <td><a class="koin-link" href="/grafik?mint=${k.mint}">${logoHTML(k,'logo-t')}<b>${k.simbol}</b></a> <span class="badge">${(k.nama||'').slice(0,16)}</span></td>
            <td>${k.sumber}</td>
            <td style="color:${warna};font-weight:700">${r.putusan}</td>
            <td style="font-size:.68rem">${alasan}</td>
            <td class="skor">${skorHTML(k.skor??'–')}</td>
            <td class="r">${fmt$(k.mc)}</td>
            <td class="r">${pct(k.h1)}</td>
            <td class="r">${pct(k.h24)}</td>
            <td class="r hide-m">${r.top10_pct!=null ? r.top10_pct+'%' : '–'}</td>
            <td class="r hide-m">${r.jumlah_holder ? r.jumlah_holder.toLocaleString('id') : '–'}</td>
            <td><a href="${k.url}" target="_blank" rel="noopener">lihat ↗</a></td>
          </tr>`;
        }).join('')
      : `<tr data-mint="${k.mint}" onclick="if(event.target.closest('a'))return;location='/grafik?mint=${k.mint}'"><td colspan="10" class="kosong">Tidak ada koin terdeteksi scam pada scan ini ✅</td></tr>`;
  } catch(e) {}
}
muat(); setInterval(muat, 120000);
</script>
</body>
</html>
